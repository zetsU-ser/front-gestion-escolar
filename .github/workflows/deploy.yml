name: CI/CD Pipeline - Frontend

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  # El nombre de la imagen se generará automáticamente usando tu nombre de usuario de GitHub
  IMAGE_NAME: ${{ github.repository_owner }}/ev3-front-gestion-escolar

jobs:
  build-and-push:
    name: Construir y Subir Imagen a GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Crear archivo .env para el build
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production
          echo "VITE_API_BASE_URL=/api" >> .env.production

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Desplegar en Alejandría
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y Actualizar Contenedor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Iniciando despliegue de Frontend en Alejandría..."
            cd ~/EV3/deploy_prod
            
            # Descargar la imagen más reciente desde GHCR
            docker compose pull front-gestion-escolar
            
            # Reiniciar el contenedor sin apagar el resto de los servicios
            docker compose up -d front-gestion-escolar
            
            # Limpiar imágenes viejas para no llenar el disco duro
            docker image prune -f
            
            echo "¡Despliegue finalizado exitosamente!"
